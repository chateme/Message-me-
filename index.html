<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<title>Multi User Secure Chat</title>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { getDatabase, ref, push, onChildAdded, set, onValue }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* CONFIG */

const cfg = {
databaseURL:"https://message-me-bbd25-default-rtdb.firebaseio.com/"
};

const app = initializeApp(cfg);
const auth = getAuth(app);
const db = getDatabase(app);

let myID;
let chatPartner;

/* AUTH */

window.register = async()=>{
const email = prompt("Email");
const pass = prompt("Password");

const user = await createUserWithEmailAndPassword(auth,email,pass);

await sendEmailVerification(user.user);

alert("Verification email sent");
};

window.login = async()=>{
const email = prompt("Email");
const pass = prompt("Password");

const user = await signInWithEmailAndPassword(auth,email,pass);

if(!user.user.emailVerified){
alert("Email verify کریں");
return;
}

myID = user.user.uid;

loadContacts();
};

/* CONTACTS */

window.addContact = ()=>{

const contact = prompt("Contact User ID");

if(!contact) return;

set(ref(db,"CONTACTS/"+myID+"/"+contact),true);
set(ref(db,"CONTACTS/"+contact+"/"+myID),true);

alert("Contact Added");
};

/* LOAD CONTACTS */

function loadContacts(){

document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";

onValue(ref(db,"CONTACTS/"+myID),snap=>{

const list = document.getElementById("contacts");
list.innerHTML="";

snap.forEach(c=>{

const div = document.createElement("div");

div.textContent=c.key;

div.onclick=()=>openChat(c.key);

list.appendChild(div);

});

});

}

/* CHAT */

window.openChat = async (user)=>{

chatPartner=user;

document.getElementById("chat").innerHTML="";

const chatID=[myID,chatPartner].sort().join("_");

onChildAdded(ref(db,"CHATS/"+chatID),snap=>{

const d=snap.val();

const div=document.createElement("div");

div.textContent =
(d.sender===myID?"Me: ":"")+atob(d.msg);

document.getElementById("chat").appendChild(div);

});

};

/* SEND MESSAGE */

window.sendMsg=()=>{

if(!chatPartner) return;

const msg=document.getElementById("msg").value;

if(!msg) return;

const chatID=[myID,chatPartner].sort().join("_");

push(ref(db,"CHATS/"+chatID),{
sender:myID,
msg:btoa(msg),
time:new Date().toLocaleTimeString()
});

document.getElementById("msg").value="";

};

window.showRegister=()=>register();
window.showLogin=()=>login();

</script>

<style>

body{
font-family:sans-serif;
background:#e5ddd5;
padding:20px;
}

#app{
display:none;
}

#contacts div{
padding:10px;
background:white;
margin:5px;
cursor:pointer;
border-radius:6px;
}

#chat{
height:60vh;
overflow:auto;
background:white;
padding:10px;
border-radius:10px;
}

input{
padding:10px;
width:70%;
}

button{
padding:10px;
}

</style>

</head>

<body>

<div id="auth">
<h2>Multi User Chat</h2>

<button onclick="showRegister()">Register</button>
<button onclick="showLogin()">Login</button>

</div>

<div id="app">

<h3>Contacts</h3>
<button onclick="addContact()">Add Contact</button>

<div id="contacts"></div>

<hr>

<div id="chat"></div>

<br>

<input id="msg">
<button onclick="sendMsg()">Send</button>

</div>

</body>
</html>
