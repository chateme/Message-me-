<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Nasir Secure v3.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root { --wa-green: #25d366; --wa-teal: #075e54; --wa-bg: #e5ddd5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; direction: rtl; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: #fff; }
        .header { background: var(--wa-teal); color: white; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; height: 60px; z-index: 100; position: relative; }
        #app-main { display: none; height: 100%; flex-direction: column; }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        #chat-window { display: none; position: fixed; inset: 0; background: var(--wa-bg); flex-direction: column; z-index: 1000; }
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); display: flex; flex-direction: column; gap: 8px; padding-bottom: 80px; }
        .msg { padding: 8px 12px 22px 12px; border-radius: 10px; max-width: 85%; position: relative; background: white; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { background: #dcf8c6; align-self: flex-end; }
        .msg-info { position: absolute; bottom: 4px; left: 8px; display: flex; align-items: center; gap: 4px; font-size: 10px; color: #777; }
        .input-wrapper { position: fixed; bottom: 0; left: 0; width: 100%; padding: 10px; z-index: 2000; }
        .main-pill { background: white; border-radius: 25px; display: flex; align-items: center; padding: 0 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); height: 50px; }
        #msg-in { flex: 1; border: none; outline: none; font-size: 16px; padding: 10px; background:transparent; }
        .pop-menu { display: none; position: absolute; bottom: 70px; background: white; border-radius: 15px; box-shadow: 0 -2px 15px rgba(0,0,0,0.2); z-index: 3000; padding: 15px; }
        #emoji-panel { right: 10px; width: 280px; grid-template-columns: repeat(6, 1fr); gap: 10px; text-align: center; font-size: 24px; }
        #auth-screen { position: fixed; inset: 0; background: #111b21; z-index: 5000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; padding: 20px; }
        .auth-box input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; background: #2a3942; color: white; text-align: center; font-size: 18px; }
    </style>
</head>
<body onclick="hidePopups()">

<div id="auth-screen">
    <div class="auth-box">
        <h2 style="color:var(--wa-green); margin-bottom:20px;">WhatsApp Nasir Secure</h2>
        <input type="email" id="u-email" placeholder="ای میل لکھیں">
        <button onclick="sendLoginLink()" style="width:100%; padding:15px; background:var(--wa-green); border:none; border-radius:30px; color:white; font-weight:bold; cursor:pointer;">لاگ ان لنک بھیجیں</button>
        <p id="auth-status" style="margin-top:15px; font-size:14px; color:#aaa;"></p>
    </div>
</div>

<div id="app-main">
    <div class="header"><b>WhatsApp Secure</b><i class="fas fa-sign-out-alt" onclick="logout()"></i></div>
    <div class="chat-list" id="contacts-ui"></div>
    <div style="position:fixed; bottom:25px; left:25px; width:60px; height:60px; background:var(--wa-green); border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:24px; cursor:pointer;" onclick="addNewChat()"><i class="fas fa-plus"></i></div>
</div>

<div id="chat-window">
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <i class="fas fa-arrow-right" onclick="goBack()"></i>
            <b id="target-title">صارف</b>
        </div>
    </div>
    <div id="chat-flow"></div>
    
    <div id="emoji-panel" class="pop-menu" onclick="event.stopPropagation()"></div>

    <div class="input-wrapper" onclick="event.stopPropagation()">
        <div class="main-pill">
            <i class="far fa-smile" style="font-size:22px; color:#667781; cursor:pointer;" onclick="toggleEmoji()"></i>
            <input type="text" id="msg-in" placeholder="محفوظ پیغام لکھیں..." oninput="upUI()">
            <i class="fas fa-paper-plane" id="send-btn" style="color:var(--wa-teal); cursor:pointer; display:none;" onclick="handleSend()"></i>
            <i class="fas fa-microphone" id="mic-btn" style="color:var(--wa-teal); cursor:pointer;"></i>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onValue, set, off } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // اپنی Firebase کی معلومات یہاں ڈالیں
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const ENC_KEY = "NASIR_SECURE_SALT_786"; // انکرپشن کی چابی

    let myID, toID, chatRef;

    // --- ایموجی پینل ---
    const ems = ["😊","😂","❤️","😍","👍","🙏","🔥","🌹","✅","📍"];
    const ep = document.getElementById('emoji-panel');
    ems.forEach(e => {
        const s = document.createElement('span'); s.innerText = e;
        s.onclick = () => { document.getElementById('msg-in').value += e; upUI(); };
        ep.appendChild(s);
    });

    // --- آتھنٹیکیشن ---
    window.sendLoginLink = async () => {
        const email = document.getElementById('u-email').value;
        try {
            await sendSignInLinkToEmail(auth, email, { url: window.location.href, handleCodeInApp: true });
            window.localStorage.setItem('emailForSignIn', email);
            document.getElementById('auth-status').innerText = "لنک آپ کی ای میل پر بھیج دیا گیا ہے!";
        } catch (e) { alert(e.message); }
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            myID = user.email.replace(/[.#$[\]]/g, "_");
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-main').style.display = 'flex';
            loadContacts();
        }
    });

    if (isSignInWithEmailLink(auth, window.location.href)) {
        let email = window.localStorage.getItem('emailForSignIn') || window.prompt('تصدیق کے لیے ای میل لکھیں');
        signInWithEmailLink(auth, email, window.location.href).then(() => window.localStorage.removeItem('emailForSignIn'));
    }

    // --- انکرپشن ---
    const encrypt = (text) => CryptoJS.AES.encrypt(text, ENC_KEY).toString();
    const decrypt = (cipher) => {
        try { return CryptoJS.AES.decrypt(cipher, ENC_KEY).toString(CryptoJS.enc.Utf8); }
        catch(e) { return "🔒 انکرپٹڈ میسج"; }
    };

    // --- چیٹ فنکشنز ---
    window.addNewChat = () => {
        const email = prompt("جس سے بات کرنی ہے اس کی ای میل لکھیں:");
        if(email) {
            const target = email.replace(/[.#$[\]]/g, "_");
            set(ref(db, `CONTACTS/${myID}/${target}`), true);
            set(ref(db, `CONTACTS/${target}/${myID}`), true);
            openChat(target);
        }
    };

    function loadContacts() {
        onValue(ref(db, `CONTACTS/${myID}`), s => {
            const ui = document.getElementById('contacts-ui'); ui.innerHTML = "";
            s.forEach(c => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerHTML = `<div style="width:40px; height:40px; background:var(--wa-teal); border-radius:50%; color:white; display:flex; align-items:center; justify-content:center;">${c.key[0].toUpperCase()}</div>
                                 <div><b>${c.key.replace(/_/g, ".")}</b><br><small>چیٹ کے لیے کلک کریں</small></div>`;
                div.onclick = () => openChat(c.key);
                ui.appendChild(div);
            });
        });
    }

    window.openChat = (n) => {
        toID = n;
        document.getElementById('target-title').innerText = n.replace(/_/g, ".");
        document.getElementById('app-main').style.display = 'none';
        document.getElementById('chat-window').style.display = 'flex';
        const cID = [myID, toID].sort().join('--');
        if(chatRef) off(chatRef);
        chatRef = ref(db, `MESSAGES/${cID}`);
        document.getElementById('chat-flow').innerHTML = "";
        onChildAdded(chatRef, s => renderMsg(s.val()));
    };

    window.handleSend = () => {
        const inp = document.getElementById('msg-in');
        if(!inp.value.trim()) return;
        push(chatRef, {
            m: encrypt(inp.value),
            s: myID,
            t: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
        });
        inp.value = ""; upUI();
    };

    function renderMsg(d) {
        const div = document.createElement('div');
        div.className = "msg " + (d.s === myID ? "sent" : "");
        div.innerHTML = decrypt(d.m) + `<div class="msg-info"><span>${d.t}</span></div>`;
        document.getElementById('chat-flow').appendChild(div);
        document.getElementById('chat-flow').scrollTop = document.getElementById('chat-flow').scrollHeight;
    }

    window.upUI = () => {
        const val = document.getElementById('msg-in').value.trim();
        document.getElementById('send-btn').style.display = val ? 'block' : 'none';
        document.getElementById('mic-btn').style.display = val ? 'none' : 'block';
    };

    window.toggleEmoji = () => ep.style.display = (ep.style.display === 'grid' ? 'none' : 'grid');
    window.hidePopups = () => ep.style.display = 'none';
    window.goBack = () => { document.getElementById('chat-window').style.display = 'none'; document.getElementById('app-main').style.display = 'flex'; };
    window.logout = () => { signOut(auth); location.reload(); };
</script>
</body>
</html>
