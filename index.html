<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexChat | Ultra Stable</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --wa-teal: #075e54; --wa-green: #25d366; --bg-dark: #111b21; --chat-bg: #e5ddd5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { height: 100vh; background: var(--bg-dark); overflow: hidden; display: flex; flex-direction: column; }

        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: var(--bg-dark); }
        .login-card { background:#1f2c33; padding:30px; border-radius:15px; text-align:center; width:90%; max-width:340px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Layout */
        #app-main { display: none; height: 100%; flex-direction: column; background: white; }
        #chat-window { display: none; position: fixed; inset: 0; z-index: 2000; flex-direction: column; background: var(--chat-bg) url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        
        .header { background: var(--wa-teal); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; height: 60px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 80px; }

        /* Messages */
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; }
        .sent { background: #dcf8c6; align-self: flex-end; }
        .received { background: white; align-self: flex-start; }
        .msg-info { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 4px; font-size: 10px; color: #667781; }
        .tick { color: #53bdeb; }

        /* Footer & Recording UI */
        .footer { padding: 8px; display: flex; align-items: center; gap: 8px; background: #f0f2f5; position: fixed; bottom: 0; width: 100%; height: 65px; z-index: 100; }
        .input-bar { background: white; border-radius: 25px; flex: 1; display: flex; align-items: center; padding: 5px 15px; height: 45px; overflow: hidden; }
        
        #rec-ui { display: none; align-items: center; gap: 12px; flex: 1; color: #ff2e2e; font-weight: bold; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        .action-btn { background: var(--wa-teal); color: white; width: 50px; height: 50px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; transition: 0.2s; touch-action: none; }
        .rec-active { background: #ff2e2e !important; transform: scale(1.15); }
        .del-icon { color: #8696a0; font-size: 20px; cursor: pointer; display: none; margin: 0 5px; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="login-card">
        <h1 style="color:var(--wa-green); margin-bottom:10px;">NexChat</h1>
        <p style="color:#8696a0; font-size:12px; margin-bottom:20px;">Private & Secure Messaging</p>
        <input type="email" id="email" placeholder="Email Address" style="width:100%; padding:14px; margin-bottom:15px; border-radius:10px; border:none; outline:none; font-size:16px;">
        <button onclick="login()" style="width:100%; padding:14px; background:var(--wa-green); border:none; border-radius:25px; font-weight:bold; color:white; cursor:pointer;">START CHATTING</button>
    </div>
</div>

<div id="app-main">
    <div class="header"><b>NexChat</b> <i class="fas fa-user-plus" onclick="addFriend()"></i></div>
    <div id="list" style="flex:1; overflow-y:auto;"></div>
</div>

<div id="chat-window">
    <div class="header">
        <div style="display:flex; align-items:center; gap:12px;">
            <i class="fas fa-arrow-left" onclick="goBack()"></i>
            <span id="chat-name" style="font-weight:bold;">User</span>
        </div>
    </div>
    <div id="chat-flow"></div>
    <div class="footer">
        <div class="input-bar">
            <input type="text" id="inp" placeholder="Type message..." oninput="ui()" style="flex:1; border:none; outline:none; font-size:16px;">
            <div id="rec-ui">
                <i class="fas fa-microphone blink"></i>
                <span id="rec-timer">00:00</span>
                <span style="color:#8696a0; font-size:12px; margin-left:auto;">Slide to cancel</span>
            </div>
        </div>
        <i class="fas fa-trash del-icon" id="del-rec" onclick="cancelRecording()"></i>
        <button class="action-btn" id="act-btn">
            <i class="fas fa-microphone" id="mic-icon"></i>
            <i class="fas fa-paper-plane" id="send-icon" style="display:none"></i>
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const config = {
        apiKey: "AIzaSyAaLNT4BuuvHeJTEqSBg52BbWxKYPHPYes",
        authDomain: "message-me-bbd25.firebaseapp.com",
        databaseURL: "https://message-me-bbd25-default-rtdb.firebaseio.com",
        projectId: "message-me-bbd25",
        storageBucket: "message-me-bbd25.appspot.com",
        appId: "1:284942258094:web:06d05da0bba156a6f6c23f"
    };

    const app = initializeApp(config);
    const db = getDatabase(app);
    let me, to, chatRef, mediaRecorder, audioChunks = [], timerInterval, isCancelled = false;

    window.login = () => {
        const mail = document.getElementById('email').value.trim();
        if(mail.includes('@')) {
            me = mail.replace(/[.#$[\]]/g, "_");
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-main').style.display = 'flex';
            loadList();
        }
    };

    window.addFriend = () => {
        const e = prompt("Enter Friend's Email:");
        if(e) {
            const tid = e.replace(/[.#$[\]]/g, "_");
            set(ref(db, `CONTACTS/${me}/${tid}`), true);
            set(ref(db, `CONTACTS/${tid}/${me}`), true);
        }
    };

    function loadList() {
        onValue(ref(db, `CONTACTS/${me}`), s => {
            const l = document.getElementById('list'); l.innerHTML = "";
            s.forEach(c => {
                const div = document.createElement('div');
                div.style = "padding:18px 20px; border-bottom:1px solid #f0f0f0; cursor:pointer; font-size:16px;";
                div.innerHTML = `<i class="fas fa-user-circle" style="color:#8696a0; margin-right:10px;"></i> <b>${c.key.replace(/_/g, ".")}</b>`;
                div.onclick = () => openChat(c.key);
                l.appendChild(div);
            });
        });
    }

    window.openChat = (id) => {
        to = id; 
        document.getElementById('chat-name').innerText = id.replace(/_/g, ".");
        document.getElementById('chat-window').style.display = 'flex';
        const room = [me, to].sort().join('--');
        document.getElementById('chat-flow').innerHTML = "";
        chatRef = ref(db, `MESSAGES/${room}`);
        onChildAdded(chatRef, s => render(s.val()));
    };

    // --- STABLE AUDIO ENGINE ---
    const btn = document.getElementById('act-btn');

    async function startRecording() {
        if(document.getElementById('inp').value.trim()) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            isCancelled = false;

            mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) audioChunks.push(e.data); };
            
            mediaRecorder.onstart = () => { toggleUI(true); startTimer(); };
            
            mediaRecorder.onstop = () => {
                toggleUI(false); stopTimer();
                if(!isCancelled && audioChunks.length > 0) {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => sendMsg(reader.result, 'voice');
                    reader.readAsDataURL(blob);
                }
                stream.getTracks().forEach(t => t.stop());
            };

            mediaRecorder.start();
        } catch (err) { alert("Please allow Microphone access!"); }
    }

    function stopRecording() { if(mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop(); }
    window.cancelRecording = () => { isCancelled = true; stopRecording(); };

    function toggleUI(active) {
        document.getElementById('rec-ui').style.display = active ? 'flex' : 'none';
        document.getElementById('inp').style.display = active ? 'none' : 'block';
        document.getElementById('del-rec').style.display = active ? 'block' : 'none';
        active ? btn.classList.add('rec-active') : btn.classList.remove('rec-active');
    }

    function startTimer() {
        let sec = 0;
        timerInterval = setInterval(() => {
            sec++;
            let m = Math.floor(sec/60).toString().padStart(2,'0');
            let s = (sec%60).toString().padStart(2,'0');
            document.getElementById('rec-timer').innerText = `${m}:${s}`;
        }, 1000);
    }

    function stopTimer() { clearInterval(timerInterval); document.getElementById('rec-timer').innerText = "00:00"; }

    // Event Listeners for Mobile & Desktop
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
    btn.addEventListener('mousedown', startRecording);
    btn.addEventListener('mouseup', stopRecording);
    
    btn.addEventListener('click', () => {
        const v = document.getElementById('inp').value.trim();
        if(v) { sendMsg(v, 'text'); document.getElementById('inp').value = ""; ui(); }
    });

    function sendMsg(val, type) {
        push(chatRef, { 
            m: val, type: type, s: me, 
            t: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
        });
    }

    function render(d) {
        const div = document.createElement('div');
        div.className = "msg " + (d.s === me ? "sent" : "received");
        let content = d.type === 'voice' ? `<audio controls src="${d.m}" style="width:200px; height:35px;"></audio>` : d.m;
        let ticks = d.s === me ? `<span class="tick"><i class="fas fa-check-double"></i></span>` : "";
        div.innerHTML = `${content} <div class="msg-info"><span>${d.t}</span> ${ticks}</div>`;
        document.getElementById('chat-flow').appendChild(div);
        document.getElementById('chat-flow').scrollTop = document.getElementById('chat-flow').scrollHeight;
    }

    window.ui = () => {
        const v = document.getElementById('inp').value.trim();
        document.getElementById('mic-icon').style.display = v ? 'none' : 'block';
        document.getElementById('send-icon').style.display = v ? 'block' : 'none';
    };
    window.goBack = () => document.getElementById('chat-window').style.display='none';
</script>
</body>
    </html>
