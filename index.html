<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexChat | Secure Global Messenger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root { --wa-teal: #075e54; --wa-green: #25d366; --bg-dark: #111b21; --chat-bg: #e5ddd5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Helvetica, sans-serif; }
        body, html { height: 100%; width: 100%; background-color: var(--bg-dark); overflow: hidden; }

        /* Modern Centered Login */
        #auth-screen { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--bg-dark); }
        .login-card { background: #1f2c33; padding: 35px 25px; border-radius: 15px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); border: 1px solid #3b4a54; }
        .login-card h1 { color: var(--wa-green); font-size: 28px; margin: 15px 0 10px; }
        .login-card input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #3b4a54; background: #2a3942; color: white; font-size: 16px; margin-bottom: 20px; outline: none; text-align: center; }
        .login-card button { width: 100%; padding: 14px; border-radius: 25px; border: none; background: var(--wa-green); color: #111b21; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }

        /* Main App Interface */
        #app-main { display: none; height: 100vh; flex-direction: column; background: white; }
        .header { background: var(--wa-teal); color: white; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; height: 60px; }

        /* Chat List Style */
        .chat-list { flex: 1; overflow-y: auto; background: white; }
        .contact-item { padding: 15px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .contact-avatar { width: 45px; height: 45px; background: #dfe5e7; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; }

        /* Chat Window */
        #chat-window { display: none; position: fixed; inset: 0; z-index: 2000; flex-direction: column; background: var(--chat-bg) url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px 20px 12px; border-radius: 10px; max-width: 75%; position: relative; font-size: 15px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; }
        .sent { background: #dcf8c6; align-self: flex-end; }
        .received { background: white; align-self: flex-start; }
        .msg-time { position: absolute; bottom: 3px; right: 8px; font-size: 10px; color: #888; }

        /* Bottom Controls */
        .footer { padding: 8px; display: flex; align-items: center; gap: 8px; }
        .input-bar { background: white; border-radius: 25px; flex: 1; display: flex; align-items: center; padding: 0 12px; min-height: 48px; }
        .input-bar input { border: none; outline: none; flex: 1; padding: 10px; font-size: 16px; background: transparent; }
        .input-bar i { color: #8696a0; font-size: 22px; cursor: pointer; padding: 5px; }
        .action-btn { background: var(--wa-teal); color: white; width: 48px; height: 48px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }

        /* Popup Panels */
        .pop-card { display: none; position: absolute; bottom: 65px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 3000; padding: 10px; }
        #emoji-box { left: 10px; width: 280px; grid-template-columns: repeat(7, 1fr); gap: 8px; max-height: 200px; overflow-y: auto; }
        #plus-box { left: 50px; width: 170px; flex-direction: column; }
        .pop-item { display: flex; align-items: center; gap: 15px; padding: 12px; cursor: pointer; border-radius: 8px; }
        .pop-item:hover { background: #f5f5f5; }
    </style>
</head>
<body onclick="closeAll()">

<div id="auth-screen">
    <div class="login-card">
        <i class="fas fa-user-lock" style="font-size: 50px; color: var(--wa-green);"></i>
        <h1>NexChat</h1>
        <p>Private & Encrypted</p>
        <input type="email" id="email-field" placeholder="Email Address">
        <button onclick="requestAccess()">Connect Now</button>
        <p id="auth-status" style="margin-top:15px; font-size:12px; color:var(--wa-green);"></p>
    </div>
</div>

<div id="app-main">
    <div class="header">
        <b style="font-size: 20px;">NexChat</b>
        <i class="fas fa-sign-out-alt" onclick="logout()" style="cursor:pointer;"></i>
    </div>
    <div class="chat-list" id="contacts-ui"></div>
    <div style="position:fixed; bottom:25px; right:25px; width:60px; height:60px; background:var(--wa-teal); border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:24px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);" onclick="createNewChat()">
        <i class="fas fa-plus"></i>
    </div>
</div>

<div id="chat-window">
    <div class="header">
        <div style="display:flex; align-items:center; gap:12px;">
            <i class="fas fa-arrow-left" onclick="backToMain()"></i>
            <div class="contact-avatar" style="width:35px; height:35px;"><i class="fas fa-user"></i></div>
            <span id="chat-name" style="font-weight: bold;">User</span>
        </div>
        <div style="display: flex; gap: 20px;">
            <i class="fas fa-video"></i>
            <i class="fas fa-phone"></i>
        </div>
    </div>

    <div id="chat-flow"></div>

    <div id="emoji-box" class="pop-card" onclick="event.stopPropagation()"></div>
    <div id="plus-box" class="pop-card" onclick="event.stopPropagation()">
        <div class="pop-item" onclick="alert('Camera opening...')"><i class="fas fa-camera" style="color:#ff2e2e;"></i> Camera</div>
        <div class="pop-item" onclick="alert('Gallery opening...')"><i class="fas fa-image" style="color:#bf59cf;"></i> Gallery</div>
        <div class="pop-item" onclick="alert('Location sent')"><i class="fas fa-location-dot" style="color:#1fa855;"></i> Location</div>
    </div>

    <div class="footer" onclick="event.stopPropagation()">
        <div class="input-bar">
            <i class="far fa-smile" onclick="togglePop('emoji-box')"></i>
            <input type="text" id="msg-input" placeholder="Message" oninput="updateUI()">
            <i class="fas fa-paperclip" onclick="togglePop('plus-box')"></i>
            <i class="fas fa-camera" id="cam-icon" onclick="alert('Camera')"></i>
        </div>
        <button class="action-btn" onclick="sendMessage()">
            <i class="fas fa-microphone" id="mic-icon"></i>
            <i class="fas fa-paper-plane" id="send-icon" style="display:none;"></i>
        </button>
    </div>
</div>

<script type="module">
    // Firebase Integration
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onValue, set, off } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAaLNT4BuuvHeJTEqSBg52BbWxKYPHPYes",
      authDomain: "message-me-bbd25.firebaseapp.com",
      databaseURL: "https://message-me-bbd25-default-rtdb.firebaseio.com",
      projectId: "message-me-bbd25",
      storageBucket: "message-me-bbd25.firebasestorage.app",
      messagingSenderId: "284942258094",
      appId: "1:284942258094:web:06d05da0bba156a6f6c23f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const SECURE_KEY = "NEXCHAT_ULTIMATE_KEY_2026";

    let currentUserEmail, currentChatRef, targetUserID;

    // 1. Authentication
    window.requestAccess = async () => {
        const email = document.getElementById('email-field').value;
        if(!email.includes('@')) return alert("Enter valid email");
        try {
            await sendSignInLinkToEmail(auth, email, { url: window.location.href, handleCodeInApp: true });
            window.localStorage.setItem('emailForSignIn', email);
            document.getElementById('auth-status').innerText = "Check your email for login link!";
        } catch (e) { alert(e.message); }
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUserEmail = user.email.replace(/[.#$[\]]/g, "_");
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-main').style.display = 'flex';
            loadContacts();
        }
    });

    if (isSignInWithEmailLink(auth, window.location.href)) {
        let email = window.localStorage.getItem('emailForSignIn') || window.prompt('Confirm Email:');
        signInWithEmailLink(auth, email, window.location.href);
    }

    // 2. Chat Logic
    const encrypt = (t) => CryptoJS.AES.encrypt(t, SECURE_KEY).toString();
    const decrypt = (c) => {
        try { return CryptoJS.AES.decrypt(c, SECURE_KEY).toString(CryptoJS.enc.Utf8) || "🔒 Message Secured"; }
        catch(e) { return "🔒 Message Secured"; }
    };

    window.createNewChat = () => {
        const email = prompt("Enter contact email:");
        if(email && email.includes('@')) {
            const target = email.replace(/[.#$[\]]/g, "_");
            set(ref(db, `CONTACTS/${currentUserEmail}/${target}`), true);
            set(ref(db, `CONTACTS/${target}/${currentUserEmail}`), true);
            openChat(target);
        }
    };

    function loadContacts() {
        onValue(ref(db, `CONTACTS/${currentUserEmail}`), (s) => {
            const ui = document.getElementById('contacts-ui'); ui.innerHTML = "";
            s.forEach(c => {
                const div = document.createElement('div'); div.className = 'contact-item';
                div.innerHTML = `<div class="contact-avatar"><i class="fas fa-user"></i></div>
                                 <b>${c.key.replace(/_/g, ".")}</b>`;
                div.onclick = () => openChat(c.key);
                ui.appendChild(div);
            });
        });
    }

    window.openChat = (id) => {
        targetUserID = id; document.getElementById('chat-name').innerText = id.replace(/_/g, ".");
        document.getElementById('chat-window').style.display = 'flex';
        const roomID = [currentUserEmail, targetUserID].sort().join('--');
        if(currentChatRef) off(currentChatRef);
        document.getElementById('chat-flow').innerHTML = "";
        currentChatRef = ref(db, `MESSAGES/${roomID}`);
        onChildAdded(currentChatRef, (s) => renderMessage(s.val()));
    };

    window.sendMessage = () => {
        const inp = document.getElementById('msg-input');
        if(!inp.value.trim()) return alert("Recording...");
        push(currentChatRef, { 
            m: encrypt(inp.value), 
            s: currentUserEmail, 
            t: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) 
        });
        inp.value = ""; updateUI();
    };

    function renderMessage(d) {
        const div = document.createElement('div');
        div.className = "msg " + (d.s === currentUserEmail ? "sent" : "received");
        div.innerHTML = decrypt(d.m) + `<div class="msg-time">${d.t}</div>`;
        const flow = document.getElementById('chat-flow');
        flow.appendChild(div);
        flow.scrollTop = flow.scrollHeight;
    }

    // 3. UI Helpers
    window.togglePop = (id) => {
        const el = document.getElementById(id);
        const isVisible = el.style.display === (id === 'emoji-box' ? 'grid' : 'flex');
        window.closeAll();
        if(!isVisible) el.style.display = (id === 'emoji-box' ? 'grid' : 'flex');
    };

    window.closeAll = () => {
        document.getElementById('emoji-box').style.display = 'none';
        document.getElementById('plus-box').style.display = 'none';
    };

    window.updateUI = () => {
        const v = document.getElementById('msg-input').value.trim();
        document.getElementById('mic-icon').style.display = v ? 'none' : 'block';
        document.getElementById('send-icon').style.display = v ? 'block' : 'none';
        document.getElementById('cam-icon').style.display = v ? 'none' : 'block';
    };

    window.backToMain = () => document.getElementById('chat-window').style.display = 'none';
    window.logout = () => { signOut(auth); location.reload(); };

    // Emoji Init
    const ems = ["😊","😂","❤️","😍","👍","😭","🙏","🔥","✨","✅","📍","👋","🎉","🤔","😢","😎","😴","🙌","👌","🌹"];
    const eb = document.getElementById('emoji-box');
    ems.forEach(e => {
        let s = document.createElement('span'); s.style.cssText = "font-size:22px; cursor:pointer; text-align:center; padding:5px;";
        s.innerText = e; s.onclick = () => { document.getElementById('msg-input').value += e; updateUI(); };
        eb.appendChild(s);
    });
</script>
</body>
                                                         </html>
