<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexChat | Global</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --teal: #075e54; --green: #25d366; --bg: #e5ddd5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #fff; height: 100vh; overflow: hidden; }
        
        .header { background: var(--teal); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; height: 60px; }
        
        /* Screens */
        #auth-screen { position: fixed; inset: 0; background: #111b21; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        #app-main { display: none; height: 100vh; flex-direction: column; }
        #chat-window { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 2000; flex-direction: column; }

        /* Chat UI */
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 10px; background: white; max-width: 80%; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { background: #dcf8c6; align-self: flex-end; }

        /* Bottom Bar */
        .footer { padding: 10px; background: #f0f0f0; display: flex; align-items: center; gap: 10px; }
        .input-pill { background: white; border-radius: 25px; flex: 1; display: flex; align-items: center; padding: 5px 15px; }
        input { border: none; outline: none; flex: 1; padding: 8px; font-size: 16px; }

        /* Menus */
        .pop-menu { display: none; position: absolute; bottom: 70px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.2); padding: 10px; z-index: 3000; }
        #emoji-box { left: 10px; width: 250px; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        #plus-box { left: 50px; width: 150px; flex-direction: column; }
        .menu-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

<div id="auth-screen">
    <h1 style="color:var(--green)">NexChat</h1>
    <p style="margin-bottom:20px">Secure Global Messenger</p>
    <input type="email" id="email-field" placeholder="Enter Email" style="padding:12px; width:80%; border-radius:8px; border:none; margin-bottom:15px; text-align:center;">
    <button onclick="loginNow()" style="background:var(--green); color:white; border:none; padding:12px 40px; border-radius:25px; font-weight:bold; cursor:pointer;">LOGIN</button>
</div>

<div id="app-main">
    <div class="header">
        <b>NexChat</b>
        <i class="fas fa-sign-out-alt" onclick="location.reload()"></i>
    </div>
    <div style="padding:20px; text-align:center; color:gray;">
        <p>No active chats.</p>
        <button onclick="startChat()" style="margin-top:20px; padding:10px 20px; border-radius:20px; border:none; background:var(--teal); color:white;">+ Start New Chat</button>
    </div>
</div>

<div id="chat-window">
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <i class="fas fa-arrow-left" onclick="closeChat()"></i>
            <span id="chat-title">Contact Name</span>
        </div>
    </div>
    
    <div id="chat-flow">
        <div class="msg">Hello! This is an encrypted message.</div>
    </div>

    <div id="emoji-box" class="pop-menu" style="display:none; grid-template-columns: repeat(5, 1fr);">
        <span onclick="addEmoji('😊')" style="cursor:pointer; font-size:20px;">😊</span>
        <span onclick="addEmoji('😂')" style="cursor:pointer; font-size:20px;">😂</span>
        <span onclick="addEmoji('❤️')" style="cursor:pointer; font-size:20px;">❤️</span>
        <span onclick="addEmoji('👍')" style="cursor:pointer; font-size:20px;">👍</span>
    </div>

    <div id="plus-box" class="pop-menu">
        <div class="menu-item" onclick="alert('Camera')"><i class="fas fa-camera"></i> Camera</div>
        <div class="menu-item" onclick="alert('Gallery')"><i class="fas fa-image"></i> Gallery</div>
        <div class="menu-item" onclick="alert('Location')"><i class="fas fa-location-dot"></i> Location</div>
    </div>

    <div class="footer">
        <div class="input-pill">
            <i class="fas fa-plus" onclick="toggleBox('plus-box')" style="color:gray; cursor:pointer;"></i>
            <i class="far fa-smile" onclick="toggleBox('emoji-box')" style="margin:0 10px; color:gray; cursor:pointer;"></i>
            <input type="text" id="msg-input" placeholder="Type a message...">
            <i class="fas fa-paper-plane" onclick="sendMsg()" style="color:var(--teal); cursor:pointer;"></i>
        </div>
        <i class="fas fa-microphone" onclick="alert('Recording...')" style="color:var(--teal); font-size:20px;"></i>
    </div>
</div>

<script>
    // بنیادی فنکشنز جو ہر حال میں کام کریں گے
    function loginNow() {
        const email = document.getElementById('email-field').value;
        if(email.includes('@')) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-main').style.display = 'flex';
        } else {
            alert("Please enter a valid email");
        }
    }

    function startChat() {
        const contact = prompt("Enter contact email:");
        if(contact) {
            document.getElementById('chat-title').innerText = contact;
            document.getElementById('chat-window').style.display = 'flex';
        }
    }

    function closeChat() {
        document.getElementById('chat-window').style.display = 'none';
    }

    function toggleBox(id) {
        const box = document.getElementById(id);
        box.style.display = (box.style.display === 'none' || box.style.display === '') ? (id === 'emoji-box' ? 'grid' : 'flex') : 'none';
    }

    function addEmoji(e) {
        document.getElementById('msg-input').value += e;
        document.getElementById('emoji-box').style.display = 'none';
    }

    function sendMsg() {
        const text = document.getElementById('msg-input').value;
        if(text.trim() !== "") {
            const flow = document.getElementById('chat-flow');
            const div = document.createElement('div');
            div.className = "msg sent";
            div.innerText = text;
            flow.appendChild(div);
            document.getElementById('msg-input').value = "";
            flow.scrollTop = flow.scrollHeight;
        }
    }
</script>

</body>
</html>
