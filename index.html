<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Bug Secure Chat Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f0f2f5; font-family: 'Inter', sans-serif; }
        .chat-container { height: calc(100vh - 220px); overflow-y: auto; scroll-behavior: smooth; }
        .sent { background-color: #dcf8c6; align-self: flex-end; border-radius: 10px 10px 0 10px; cursor: pointer; }
        .received { background-color: #ffffff; align-self: flex-start; border-radius: 10px 10px 10px 0; }
        .msg-box { max-width: 75%; padding: 8px 15px; margin-bottom: 5px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; }
        .delete-hint { font-size: 8px; color: #999; display: block; text-align: right; margin-top: 2px; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <div id="auth-screen" class="flex flex-col items-center justify-center h-full">
        <div class="bg-white p-10 rounded-3xl shadow-2xl w-96 text-center">
            <h2 class="text-3xl font-black mb-2 text-green-600">Secure Chat</h2>
            <input id="email" type="email" placeholder="Email" class="w-full p-3 mb-3 border rounded-xl outline-none focus:ring-2 focus:ring-green-400">
            <input id="pass" type="password" placeholder="Password" class="w-full p-3 mb-6 border rounded-xl outline-none focus:ring-2 focus:ring-green-400">
            <button onclick="handleAuth('login')" class="w-full bg-green-500 text-white font-bold p-3 rounded-xl hover:bg-green-600 transition shadow-lg">Login</button>
            <button onclick="handleAuth('register')" class="w-full mt-4 text-blue-500 text-sm hover:underline">Create Account</button>
        </div>
    </div>

    <div id="app-screen" class="hidden flex flex-col h-full max-w-lg mx-auto w-full bg-[#e5ddd5] shadow-2xl">
        <header class="bg-[#075e54] p-4 text-white flex justify-between items-center shadow-md">
            <div>
                <h1 class="font-bold">Messenger Pro</h1>
                <p id="my-id" class="text-[9px] opacity-70 font-mono"></p>
            </div>
            <button onclick="location.reload()" class="bg-red-500 text-[10px] px-3 py-1 rounded-full">Logout</button>
        </header>

        <div class="p-3 bg-white border-b flex gap-2">
            <input id="new-id" placeholder="Friend's User ID" class="flex-1 p-2 border rounded-lg text-xs outline-none">
            <button onclick="addContact()" class="bg-blue-600 text-white px-4 rounded-lg font-bold">+</button>
        </div>

        <div id="contacts" class="flex p-3 gap-2 overflow-x-auto bg-gray-50 border-b"></div>

        <div id="chat-window" class="chat-container p-4 flex flex-col space-y-2">
            <div class="m-auto text-gray-400 text-xs italic">Select a contact to chat</div>
        </div>

        <div id="input-area" class="p-4 bg-gray-100 flex gap-2 border-t hidden">
            <input id="msg-input" type="text" placeholder="Type a message..." class="flex-1 p-3 border rounded-full px-5 outline-none shadow-inner">
            <button onclick="sendMsg()" class="bg-[#128c7e] text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, onChildAdded, remove, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const cfg = { databaseURL: "https://message-me-bbd25-default-rtdb.firebaseio.com/" };
        const app = initializeApp(cfg);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let myID = "";
        let chatUser = "";

        window.handleAuth = async (mode) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try {
                const u = (mode === 'register') ? await createUserWithEmailAndPassword(auth, email, pass) : await signInWithEmailAndPassword(auth, email, pass);
                myID = u.user.uid;
                startApp();
            } catch(e) { alert(e.message); }
        };

        function startApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('my-id').textContent = `ID: ${myID}`;
            loadContacts();
        }

        window.addContact = () => {
            const id = document.getElementById('new-id').value.trim();
            if(!id || id === myID) return;
            set(ref(db, `CONTACTS/${myID}/${id}`), true);
            set(ref(db, `CONTACTS/${id}/${myID}`), true);
            document.getElementById('new-id').value = "";
        };

        function loadContacts() {
            onValue(ref(db, `CONTACTS/${myID}`), snap => {
                const box = document.getElementById('contacts');
                box.innerHTML = "";
                snap.forEach(child => {
                    const btn = document.createElement("button");
                    btn.className = "bg-white border px-3 py-1 rounded-full text-[10px] shadow-sm hover:bg-green-50";
                    btn.textContent = child.key.substring(0,6) + "...";
                    btn.onclick = () => openChat(child.key);
                    box.appendChild(btn);
                });
            });
        }

        window.openChat = (targetID) => {
            chatUser = targetID;
            document.getElementById('input-area').classList.remove('hidden');
            const chatBox = document.getElementById('chat-window');
            chatBox.innerHTML = "";

            const chatID = [myID, targetID].sort().join("_");
            const chatPath = `CHATS/${chatID}`;

            // Listen for new messages
            onChildAdded(ref(db, chatPath), snap => {
                const data = snap.val();
                const isMe = data.sender === myID;
                const div = document.createElement("div");
                div.id = `msg-${snap.key}`;
                div.className = `msg-box ${isMe ? 'sent' : 'received'}`;
                div.innerHTML = `<span>${atob(data.msg)}</span>${isMe ? '<span class="delete-hint">Click to delete</span>' : ''}`;
                
                if(isMe) {
                    div.onclick = () => {
                        if(confirm("Delete this message?")) remove(ref(db, `${chatPath}/${snap.key}`));
                    };
                }
                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight;
            });

            // Handle real-time deletion
            onChildRemoved(ref(db, chatPath), snap => {
                const el = document.getElementById(`msg-${snap.key}`);
                if(el) el.remove();
            });
        };

        window.sendMsg = () => {
            const input = document.getElementById('msg-input');
            if(!input.value.trim()) return;
            const chatID = [myID, chatUser].sort().join("_");
            push(ref(db, `CHATS/${chatID}`), {
                sender: myID,
                msg: btoa(input.value),
                time: Date.now()
            });
            input.value = "";
        };
    </script>
</body>
</html>
