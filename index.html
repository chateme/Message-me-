<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Bug Secure Messenger Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container { height: calc(100vh - 250px); overflow-y: auto; display: flex; flex-direction: column; }
        .sent { background: #dcf8c6; align-self: flex-end; border-radius: 10px 10px 0 10px; margin: 5px; padding: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); cursor: pointer; }
        .received { background: #fff; align-self: flex-start; border-radius: 10px 10px 10px 0; margin: 5px; padding: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div id="auth-screen" class="flex flex-col items-center justify-center h-screen px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
            <h2 class="text-3xl font-bold text-green-600 mb-6">Messenger Login</h2>
            <input id="email" type="email" placeholder="Email (e.g. name@mail.com)" class="w-full p-3 mb-3 border rounded-lg outline-none focus:border-green-500">
            <input id="pass" type="password" placeholder="Password (min 6 chars)" class="w-full p-3 mb-6 border rounded-lg outline-none focus:border-green-500">
            
            <div class="flex flex-col gap-3">
                <button id="login-btn" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">Login</button>
                <button id="reg-btn" class="w-full bg-gray-200 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-300 transition">Create New Account</button>
            </div>
            <p id="auth-status" class="mt-4 text-xs text-red-500 font-semibold"></p>
        </div>
    </div>

    <div id="app-screen" class="hidden flex flex-col h-screen max-w-lg mx-auto bg-[#e5ddd5] shadow-2xl">
        <header class="bg-[#075e54] p-4 text-white flex justify-between items-center">
            <div>
                <h1 class="font-bold">Chat Pro</h1>
                <p id="display-my-id" class="text-[9px] font-mono opacity-80"></p>
            </div>
            <button onclick="location.reload()" class="bg-red-500 text-[10px] px-2 py-1 rounded">Logout</button>
        </header>

        <div class="bg-white p-2 border-b flex gap-2">
            <input id="friend-id-input" placeholder="Paste Friend's User ID" class="flex-1 p-2 border rounded text-xs outline-none">
            <button id="add-contact-btn" class="bg-blue-600 text-white px-4 rounded font-bold">+</button>
        </div>

        <div id="contacts-bar" class="flex p-2 gap-2 overflow-x-auto bg-gray-50 border-b min-h-[50px]"></div>

        <div id="chat-box" class="chat-container p-4">
            <p class="m-auto text-gray-500 text-xs text-center">Select a contact to start chatting</p>
        </div>

        <div id="input-bar" class="p-4 bg-gray-100 flex gap-2 hidden">
            <input id="msg-input" type="text" placeholder="Type message..." class="flex-1 p-2 border rounded-full px-4 outline-none">
            <button id="send-btn" class="bg-[#128c7e] text-white w-10 h-10 rounded-full flex items-center justify-center">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, onChildAdded, remove, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // IMPORTANT: Replace these with YOUR actual Firebase keys
        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "YOUR-PROJECT.firebaseapp.com",
            databaseURL: "https://message-me-bbd25-default-rtdb.firebaseio.com/",
            projectId: "YOUR-PROJECT-ID",
            storageBucket: "YOUR-PROJECT.appspot.com",
            messagingSenderId: "YOUR-ID",
            appId: "YOUR-APP-ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let myUID = "";
        let activeFriend = "";

        // --- Auth Functions ---
        const loginUser = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            if(!email || !pass) return alert("Enter email and password");

            try {
                const cred = await signInWithEmailAndPassword(auth, email, pass);
                myUID = cred.user.uid;
                showApp();
            } catch (err) {
                alert("Login Error: " + err.message);
            }
        };

        const registerUser = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            if(!email || pass.length < 6) return alert("Email must be valid and password min 6 chars");

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                myUID = cred.user.uid;
                alert("Account Created Successfully!");
                showApp();
            } catch (err) {
                alert("Registration Error: " + err.message);
            }
        };

        const showApp = () => {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('display-my-id').textContent = "My ID: " + myUID;
            loadContacts();
        };

        // --- Contact Logic ---
        const addFriend = () => {
            const fID = document.getElementById('friend-id-input').value.trim();
            if(!fID || fID === myUID) return alert("Invalid Friend ID");
            set(ref(db, `CONTACTS/${myUID}/${fID}`), true);
            set(ref(db, `CONTACTS/${fID}/${myUID}`), true);
            document.getElementById('friend-id-input').value = "";
            alert("Contact added!");
        };

        const loadContacts = () => {
            onValue(ref(db, `CONTACTS/${myUID}`), snap => {
                const bar = document.getElementById('contacts-bar');
                bar.innerHTML = "";
                snap.forEach(child => {
                    const btn = document.createElement("button");
                    btn.className = "bg-white border px-3 py-1 rounded-full text-[10px] whitespace-nowrap shadow-sm";
                    btn.textContent = child.key.substring(0,8);
                    btn.onclick = () => startChat(child.key);
                    bar.appendChild(btn);
                });
            });
        };

        // --- Messaging Logic ---
        const startChat = (friendID) => {
            activeFriend = friendID;
            document.getElementById('input-bar').classList.remove('hidden');
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = "";

            const chatID = [myUID, friendID].sort().join("_");
            const chatPath = `CHATS/${chatID}`;

            onChildAdded(ref(db, chatPath), snap => {
                const msgData = snap.val();
                const isMe = msgData.sender === myUID;
                const div = document.createElement("div");
                div.id = "msg-" + snap.key;
                div.className = isMe ? "sent" : "received";
                div.innerHTML = `<span>${atob(msgData.msg)}</span><br><small style='font-size:7px; opacity:0.5'>${isMe ? 'Click to delete' : ''}</small>`;
                
                if(isMe) {
                    div.onclick = () => { if(confirm("Delete message?")) remove(ref(db, `${chatPath}/${snap.key}`)); };
                }
                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight;
            });

            onChildRemoved(ref(db, chatPath), snap => {
                const el = document.getElementById("msg-" + snap.key);
                if(el) el.remove();
            });
        };

        const sendMessage = () => {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text) return;

            const chatID = [myUID, activeFriend].sort().join("_");
            push(ref(db, `CHATS/${chatID}`), {
                sender: myUID,
                msg: btoa(text),
                timestamp: Date.now()
            });
            input.value = "";
        };

        // Event Listeners (This fixes the button not working issue)
        document.getElementById('login-btn').onclick = loginUser;
        document.getElementById('reg-btn').onclick = registerUser;
        document.getElementById('add-contact-btn').onclick = addFriend;
        document.getElementById('send-btn').onclick = sendMessage;

    </script>
</body>
    </html>
