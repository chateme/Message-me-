<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexChat | Final Fix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --wa-teal: #075e54; --wa-green: #25d366; --bg-dark: #111b21; --chat-bg: #e5ddd5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { height: 100%; background: var(--bg-dark); overflow: hidden; }

        /* App Structure */
        #auth-screen { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: var(--bg-dark); }
        #app-main { display: none; height: 100vh; flex-direction: column; background: white; }
        #chat-window { display: none; position: fixed; inset: 0; z-index: 2000; flex-direction: column; background: var(--chat-bg) url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }

        .header { background: var(--wa-teal); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; height: 60px; }
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }

        /* Bubbles & Links Fix */
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; position: relative; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); word-wrap: break-word; }
        .sent { background: #dcf8c6; align-self: flex-end; }
        .received { background: white; align-self: flex-start; }
        .msg a { color: #027eb5; text-decoration: underline; font-weight: bold; }
        .msg img { width: 100%; max-width: 250px; border-radius: 8px; margin: 5px 0; display: block; }
        .time { font-size: 10px; color: #888; text-align: right; margin-top: 4px; }

        /* Footer Controls */
        .footer { padding: 8px; display: flex; align-items: center; gap: 8px; background: #f0f2f5; }
        .input-bar { background: white; border-radius: 25px; flex: 1; display: flex; align-items: center; padding: 5px 12px; }
        .input-bar input { border: none; outline: none; flex: 1; padding: 8px; font-size: 16px; background: transparent; }
        .action-btn { background: var(--wa-teal); color: white; width: 48px; height: 48px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; transition: 0.3s; }

        /* Recording Visual */
        .rec-active { background: #ff2e2e !important; transform: scale(1.2); box-shadow: 0 0 15px rgba(255,0,0,0.4); }

        /* Popup Menus */
        .pop { display: none; position: absolute; bottom: 70px; background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); z-index: 3000; padding: 8px; }
        #plus-panel { left: 50px; width: 180px; flex-direction: column; }
        .item { padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
    </style>
</head>
<body onclick="closeAll()">

<div id="auth-screen">
    <div style="background:#1f2c33; padding:30px; border-radius:15px; text-align:center; width:90%; max-width:340px;">
        <h1 style="color:var(--wa-green); margin-bottom:20px;">NexChat</h1>
        <input type="email" id="email" placeholder="Enter Email" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:none; text-align:center;">
        <button onclick="login()" style="width:100%; padding:12px; background:var(--wa-green); border:none; border-radius:25px; font-weight:bold; color:white;">LOGIN</button>
    </div>
</div>

<div id="app-main">
    <div class="header"><b>NexChat</b> <i class="fas fa-plus" onclick="addFriend()"></i></div>
    <div id="list" style="flex:1; overflow-y:auto;"></div>
</div>

<div id="chat-window">
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <i class="fas fa-arrow-left" onclick="goBack()"></i>
            <span id="chat-name">User</span>
        </div>
    </div>
    <div id="chat-flow"></div>

    <div id="plus-panel" class="pop" onclick="event.stopPropagation()">
        <label for="cam" class="item"><i class="fas fa-camera" style="color:#ff2e2e;"></i> Camera</label>
        <label for="gal" class="item"><i class="fas fa-image" style="color:#bf59cf;"></i> Gallery</label>
        <div class="item" onclick="sendLoc()"><i class="fas fa-location-dot" style="color:#1fa855;"></i> Send Location</div>
    </div>

    <input type="file" id="cam" accept="image/*" capture="camera" style="display:none" onchange="upFile(this)">
    <input type="file" id="gal" accept="image/*" style="display:none" onchange="upFile(this)">

    <div class="footer" onclick="event.stopPropagation()">
        <div class="input-bar">
            <input type="text" id="inp" placeholder="Type a message..." oninput="ui()">
            <i class="fas fa-paperclip" onclick="toggleMenu('plus-panel')" style="color:#8696a0; cursor:pointer; padding:5px;"></i>
        </div>
        <button class="action-btn" id="act-btn" onmousedown="startRec()" onmouseup="stopRec()" onclick="doAction()">
            <i class="fas fa-microphone" id="mic"></i>
            <i class="fas fa-paper-plane" id="plane" style="display:none"></i>
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const config = {
        apiKey: "AIzaSyAaLNT4BuuvHeJTEqSBg52BbWxKYPHPYes",
        authDomain: "message-me-bbd25.firebaseapp.com",
        databaseURL: "https://message-me-bbd25-default-rtdb.firebaseio.com",
        projectId: "message-me-bbd25",
        storageBucket: "message-me-bbd25.appspot.com",
        appId: "1:284942258094:web:06d05da0bba156a6f6c23f"
    };

    const app = initializeApp(config);
    const db = getDatabase(app);
    let me, to, chatRef;

    window.login = () => {
        const e = document.getElementById('email').value;
        if(e.includes('@')) {
            me = e.replace(/[.#$[\]]/g, "_");
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-main').style.display = 'flex';
            loadList();
        }
    };

    window.addFriend = () => {
        const e = prompt("Friend Email:");
        if(e) {
            const tid = e.replace(/[.#$[\]]/g, "_");
            set(ref(db, `CONTACTS/${me}/${tid}`), true);
            set(ref(db, `CONTACTS/${tid}/${me}`), true);
        }
    };

    function loadList() {
        onValue(ref(db, `CONTACTS/${me}`), s => {
            const l = document.getElementById('list'); l.innerHTML = "";
            s.forEach(c => {
                const d = document.createElement('div'); d.style.padding="15px 20px"; d.style.borderBottom="1px solid #eee";
                d.innerHTML = `<b>${c.key.replace(/_/g, ".")}</b>`;
                d.onclick = () => openChat(c.key);
                l.appendChild(d);
            });
        });
    }

    window.openChat = (id) => {
        to = id; document.getElementById('chat-name').innerText = id.replace(/_/g, ".");
        document.getElementById('chat-window').style.display = 'flex';
        const room = [me, to].sort().join('--');
        document.getElementById('chat-flow').innerHTML = "";
        chatRef = ref(db, `MESSAGES/${room}`);
        onChildAdded(chatRef, s => render(s.val()));
    };

    window.doAction = () => {
        const v = document.getElementById('inp').value.trim();
        if(v) {
            push(chatRef, { m: v, type: 'text', s: me, t: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
            document.getElementById('inp').value = ""; ui();
        }
    };

    // Corrected Location Link
    window.sendLoc = () => {
        navigator.geolocation.getCurrentPosition(p => {
            const lat = p.coords.latitude;
            const lon = p.coords.longitude;
            const link = `https://www.google.com/maps?q=${lat},${lon}`;
            push(chatRef, { m: link, type: 'location', s: me, t: 'Just now' });
        });
        closeAll();
    };

    // Recording Feedback UI
    window.startRec = () => {
        if(!document.getElementById('inp').value) {
            document.getElementById('act-btn').classList.add('rec-active');
            console.log("Recording simulation started...");
        }
    };
    window.stopRec = () => {
        document.getElementById('act-btn').classList.remove('rec-active');
    };

    window.upFile = (input) => {
        if(input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => push(chatRef, { m: e.target.result, type: 'image', s: me, t: 'Sent' });
            reader.readAsDataURL(input.files[0]);
        }
        closeAll();
    };

    function render(d) {
        const div = document.createElement('div');
        div.className = "msg " + (d.s === me ? "sent" : "received");
        if(d.type === 'image') {
            div.innerHTML = `<img src="${d.m}" onclick="window.open(this.src)"> <div class="time">${d.t}</div>`;
        } else if(d.type === 'location') {
            div.innerHTML = `📍 <a href="${d.m}" target="_blank">View My Location</a> <div class="time">${d.t}</div>`;
        } else {
            div.innerHTML = d.m + `<div class="time">${d.t}</div>`;
        }
        document.getElementById('chat-flow').appendChild(div);
        document.getElementById('chat-flow').scrollTop = document.getElementById('chat-flow').scrollHeight;
    }

    window.ui = () => {
        const v = document.getElementById('inp').value.trim();
        document.getElementById('mic').style.display = v ? 'none' : 'block';
        document.getElementById('plane').style.display = v ? 'block' : 'none';
    };
    window.toggleMenu = (id) => {
        const el = document.getElementById(id);
        el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
    };
    window.closeAll = () => document.getElementById('plus-panel').style.display='none';
    window.goBack = () => document.getElementById('chat-window').style.display='none';
</script>
</body>
    </html>
