<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<title>Zero Bug Secure Chat</title>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
sendEmailVerification }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { getDatabase,
ref,
set,
push,
onValue,
onChildAdded }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* CONFIG */

const cfg={
databaseURL:"https://message-me-bbd25-default-rtdb.firebaseio.com/"
};

const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getDatabase(app);

let myID="";
let chatUser="";

/* AUTH */

window.register=async()=>{

const email=prompt("Email");
const pass=prompt("Password (8+)");

try{

const u=await createUserWithEmailAndPassword(auth,email,pass);

await sendEmailVerification(u.user);

alert("Verification email sent");

}catch(e){
alert(e.message);
}

};

window.login=async()=>{

const email=prompt("Email");
const pass=prompt("Password");

try{

const u=await signInWithEmailAndPassword(auth,email,pass);

if(!u.user.emailVerified){
alert("Email verify first");
return;
}

myID=u.user.uid;

loadContacts();

}catch(e){
alert(e.message);
}

};

/* CONTACTS */

window.addContact=()=>{

const c=prompt("Enter User ID");

if(!c) return;

set(ref(db,"CONTACTS/"+myID+"/"+c),true);
set(ref(db,"CONTACTS/"+c+"/"+myID),true);

};

/* LOAD CONTACTS */

function loadContacts(){

document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";

onValue(ref(db,"CONTACTS/"+myID),snap=>{

const box=document.getElementById("contacts");
box.innerHTML="";

snap.forEach(child=>{

const id=child.key;

const div=document.createElement("div");

div.textContent=id;

div.onclick=()=>openChat(id);

box.appendChild(div);

});

});

}

/* CHAT */

window.openChat=(user)=>{

chatUser=user;

document.getElementById("chat").innerHTML="";

const chatID=[myID,chatUser].sort().join("_");

onChildAdded(ref(db,"CHATS/"+chatID),snap=>{

const d=snap.val();

const div=document.createElement("div");

div.textContent=
(d.sender===myID?"Me: ":"")+atob(d.msg);

document.getElementById("chat").appendChild(div);

});

};

/* SEND */

window.sendMsg=()=>{

if(!chatUser) return;

const msg=document.getElementById("msg").value;

if(!msg) return;

const chatID=[myID,chatUser].sort().join("_");

push(ref(db,"CHATS/"+chatID),{
sender:myID,
msg:btoa(msg),
time:new Date().toLocaleTimeString()
});

document.getElementById("msg").value="";

};

</script>

<style>

body{
font-family:sans-serif;
background:#e5ddd5;
padding:20px;
}

#app{
display:none;
}

#contacts div{
padding:10px;
background:white;
margin:5px;
cursor:pointer;
border-radius:6px;
}

#chat{
height:60vh;
overflow:auto;
background:white;
padding:10px;
border-radius:10px;
}

input{
padding:10px;
width:70%;
}

button{
padding:10px;
}

</style>

</head>

<body>

<div id="auth">

<h2>Secure Chat</h2>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

</div>

<div id="app">

<h3>Contacts</h3>

<button onclick="addContact()">Add Contact</button>

<div id="contacts"></div>

<hr>

<div id="chat"></div>

<br>

<input id="msg" placeholder="Message">
<button onclick="sendMsg()">Send</button>

</div>

</body>
</html>
