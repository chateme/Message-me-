<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexChat | Global Messenger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root { --wa-teal: #075e54; --wa-green: #25d366; --bg-dark: #111b21; --chat-bg: #e5ddd5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Helvetica, sans-serif; }
        body, html { height: 100%; width: 100%; background-color: var(--bg-dark); overflow: hidden; }

        /* Fixed Login UI */
        #auth-screen { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--bg-dark); }
        .login-card { background: #1f2c33; padding: 30px; border-radius: 15px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #3b4a54; }
        .login-card h1 { color: var(--wa-green); font-size: 26px; margin-bottom: 20px; }
        .login-card input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #3b4a54; background: #2a3942; color: white; margin-bottom: 20px; outline: none; text-align: center; font-size: 16px; }
        .login-card button { width: 100%; padding: 15px; border-radius: 30px; border: none; background: var(--wa-green); color: #111b21; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* Main UI */
        #app-main { display: none; height: 100vh; flex-direction: column; background: white; }
        .header { background: var(--wa-teal); color: white; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; height: 60px; }
        
        /* Chat Window */
        #chat-window { display: none; position: fixed; inset: 0; z-index: 2000; flex-direction: column; background: var(--chat-bg) url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px 20px 12px; border-radius: 10px; max-width: 80%; position: relative; font-size: 15px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; }
        .sent { background: #dcf8c6; align-self: flex-end; }
        .received { background: white; align-self: flex-start; }
        .msg-time { position: absolute; bottom: 3px; right: 8px; font-size: 10px; color: #888; }

        /* Footer & Buttons */
        .footer { padding: 8px; display: flex; align-items: center; gap: 8px; background: transparent; }
        .input-bar { background: white; border-radius: 25px; flex: 1; display: flex; align-items: center; padding: 0 10px; min-height: 50px; }
        .input-bar input { border: none; outline: none; flex: 1; padding: 10px; font-size: 16px; background: transparent; }
        .input-bar i { color: #8696a0; font-size: 22px; cursor: pointer; padding: 5px; }
        .action-btn { background: var(--wa-teal); color: white; width: 50px; height: 50px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        /* Working Popups */
        .pop-panel { display: none; position: absolute; bottom: 70px; background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); z-index: 3000; padding: 15px; }
        #emoji-box { left: 10px; width: 300px; grid-template-columns: repeat(7, 1fr); gap: 10px; height: 180px; overflow-y: auto; display: none; }
        #plus-box { left: 15px; width: 180px; flex-direction: column; }
        .pop-item { display: flex; align-items: center; gap: 15px; padding: 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
        
        /* Hidden Inputs */
        #file-input, #cam-input { display: none; }
    </style>
</head>
<body onclick="closeAll()">

<div id="auth-screen">
    <div class="login-card">
        <h1>NexChat</h1>
        <input type="email" id="email-field" placeholder="Enter Email">
        <button onclick="handleAuth()">Login with Firebase</button>
    </div>
</div>

<div id="app-main">
    <div class="header"><b>NexChat</b> <i class="fas fa-plus" onclick="startNewChat()"></i></div>
    <div id="contacts-list" style="flex:1; overflow-y:auto;"></div>
</div>

<div id="chat-window">
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <i class="fas fa-arrow-left" onclick="goBack()"></i>
            <span id="target-title">User</span>
        </div>
    </div>
    <div id="chat-flow"></div>

    <div id="emoji-box" class="pop-panel" onclick="event.stopPropagation()"></div>
    <div id="plus-box" class="pop-panel" onclick="event.stopPropagation()">
        <label for="cam-input" class="pop-item"><i class="fas fa-camera" style="color:#ff2e2e;"></i> Camera</label>
        <label for="file-input" class="pop-item"><i class="fas fa-image" style="color:#bf59cf;"></i> Gallery</label>
        <div class="pop-item" onclick="sendLocation()"><i class="fas fa-location-dot" style="color:#1fa855;"></i> Location</div>
    </div>

    <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)">
    <input type="file" id="cam-input" accept="image/*" capture="camera" onchange="handleFile(event)">

    <div class="footer" onclick="event.stopPropagation()">
        <div class="input-bar">
            <i class="far fa-smile" onclick="toggleMenu('emoji-box')"></i>
            <input type="text" id="msg-input" placeholder="Message" oninput="toggleBtn()">
            <i class="fas fa-paperclip" onclick="toggleMenu('plus-box')"></i>
        </div>
        <button class="action-btn" onclick="sendData()">
            <i class="fas fa-microphone" id="mic-icon"></i>
            <i class="fas fa-paper-plane" id="send-icon" style="display:none;"></i>
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Your Working Config
    const firebaseConfig = {
      apiKey: "AIzaSyAaLNT4BuuvHeJTEqSBg52BbWxKYPHPYes",
      authDomain: "message-me-bbd25.firebaseapp.com",
      databaseURL: "https://message-me-bbd25-default-rtdb.firebaseio.com",
      projectId: "message-me-bbd25",
      storageBucket: "message-me-bbd25.firebasestorage.app",
      messagingSenderId: "284942258094",
      appId: "1:284942258094:web:06d05da0bba156a6f6c23f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const KEY = "NEX_SECURE_786";

    let me, to, chatRef;

    // Auth Logic
    window.handleAuth = () => {
        const email = document.getElementById('email-field').value;
        sendSignInLinkToEmail(auth, email, { url: window.location.href, handleCodeInApp: true });
        localStorage.setItem('email', email);
        alert("Check Email!");
    };

    onAuthStateChanged(auth, (user) => {
        if(user) {
            me = user.email.replace(/[.#$[\]]/g, "_");
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-main').style.display = 'flex';
            loadList();
        }
    });

    if (isSignInWithEmailLink(auth, window.location.href)) {
        signInWithEmailLink(auth, localStorage.getItem('email'), window.location.href);
    }

    // Messaging
    window.sendData = () => {
        const val = document.getElementById('msg-input').value.trim();
        if(!val) return alert("Mic Active (Voice integration next)");
        const enc = CryptoJS.AES.encrypt(val, KEY).toString();
        push(chatRef, { m: enc, s: me, t: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
        document.getElementById('msg-input').value = ""; toggleBtn();
    };

    window.openChat = (id) => {
        to = id; document.getElementById('target-title').innerText = id.replace(/_/g, ".");
        document.getElementById('chat-window').style.display = 'flex';
        const room = [me, to].sort().join('--');
        document.getElementById('chat-flow').innerHTML = "";
        chatRef = ref(db, `MESSAGES/${room}`);
        onChildAdded(chatRef, (s) => {
            const d = s.val();
            const msg = CryptoJS.AES.decrypt(d.m, KEY).toString(CryptoJS.enc.Utf8);
            const div = document.createElement('div');
            div.className = "msg " + (d.s === me ? "sent" : "received");
            div.innerHTML = msg + `<div class="msg-time">${d.t}</div>`;
            document.getElementById('chat-flow').appendChild(div);
            document.getElementById('chat-flow').scrollTop = document.getElementById('chat-flow').scrollHeight;
        });
    };

    // Real File/Gallery Handling
    window.handleFile = (e) => {
        const file = e.target.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = (f) => {
                const base64 = f.target.result;
                const enc = CryptoJS.AES.encrypt("📷 Image: " + base64.substring(0, 50) + "...", KEY).toString();
                push(chatRef, { m: enc, s: me, t: "Sent" });
                alert("File Uploaded to Chat!");
            };
            reader.readAsDataURL(file);
        }
        closeAll();
    };

    window.sendLocation = () => {
        navigator.geolocation.getCurrentPosition(p => {
            const loc = `https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;
            const enc = CryptoJS.AES.encrypt("📍 Location: " + loc, KEY).toString();
            push(chatRef, { m: enc, s: me, t: "Now" });
        });
        closeAll();
    };

    // UI Helpers
    window.toggleMenu = (id) => {
        const el = document.getElementById(id);
        const show = el.style.display === 'none' || el.style.display === '';
        closeAll();
        if(show) el.style.display = (id === 'emoji-box' ? 'grid' : 'flex');
    };
    window.closeAll = () => { document.getElementById('emoji-box').style.display = 'none'; document.getElementById('plus-box').style.display = 'none'; };
    window.toggleBtn = () => {
        const val = document.getElementById('msg-input').value.trim();
        document.getElementById('mic-icon').style.display = val ? 'none' : 'block';
        document.getElementById('send-icon').style.display = val ? 'block' : 'none';
    };
    window.startNewChat = () => { const e = prompt("Email:"); if(e) { set(ref(db, `CONTACTS/${me}/${e.replace(/[.#$[\]]/g, "_")}`), true); } };
    function loadList() { onValue(ref(db, `CONTACTS/${me}`), s => {
        document.getElementById('contacts-list').innerHTML = "";
        s.forEach(c => {
            const d = document.createElement('div'); d.style.padding="20px"; d.style.borderBottom="1px solid #eee";
            d.innerText = c.key.replace(/_/g, "."); d.onclick = () => openChat(c.key);
            document.getElementById('contacts-list').appendChild(d);
        });
    });}
    window.goBack = () => document.getElementById('chat-window').style.display='none';

    // Emoji Setup
    const ems = ["😊","😂","❤️","😍","👍","😭","🙏","🔥","✨","✅","📍","👋","🎉"];
    ems.forEach(e => {
        const s = document.createElement('span'); s.innerText = e; s.style.cursor="pointer"; s.style.fontSize="22px";
        s.onclick = () => { document.getElementById('msg-input').value += e; toggleBtn(); };
        document.getElementById('emoji-box').appendChild(s);
    });
</script>
</body>
    </html>
